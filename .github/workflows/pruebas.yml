name: Pruebas

# En cada PR: las pruebas (npm test) y el build del sitio, como en el despliegue.
on:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Pruebas
        run: npm test
      - name: Build VitePress site
        run: npx vitepress build src
